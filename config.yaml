api:
  cors_origins:
  - http://localhost:5173
  - http://127.0.0.1:5173
  - http://localhost:3000
  - http://127.0.0.1:3000
  host: 0.0.0.0
  port: 8000
features:
  categorical:
  - airline
  - departure_time
  - arrival_time
  - stops
  - class
  - source_city
  - destination_city
  numerical:
  - duration
  - days_left
  - source_lat
  - source_lon
  - destination_lat
  - destination_lon
  - distance_km
  unsupported_ui_fields:
  - seat_type
  - baggage
  - lounge_access
  - meal
  - aircraft_type
  - refundable
  - seat_selection
known_training_cities:
- Delhi
- Mumbai
- Bangalore
- Kolkata
- Hyderabad
- Chennai
- Kochi
paths:
  airports: data/reference/airports.csv
  comparison: models/model_comparison.json
  feature_importance: models/feature_importance.json
  geo_experiment: models/geo_experiment.json
  metadata: models/model_metadata.json
  metrics: models/metrics.json
  models_dir: models
  pipeline: models/airfare_pipeline.pkl
  processed: data/processed/processed_flights.csv
  quality_report: data/processed/data_quality_report.json
  raw_business: business.csv
  raw_clean: data/processed/merged_data.csv
  raw_economy: economy.csv
  validation: models/validation.json
project_name: SkyCast
random_state: 42
target: price
test_size: 0.2
training:
  cv_folds: 3
  geo_experiment: true
  tune_best_model: true
  tune_iter: 8
  tune_sample_size: 40000
  use_flight_code: false
